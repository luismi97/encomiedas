; Producción: compila PHP una sola vez y sirve el bytecode desde RAM.
opcache.enable=1
opcache.enable_cli=0

opcache.memory_consumption=192
opcache.interned_strings_buffer=12
opcache.max_accelerated_files=20000

; Revisa cambios cada 2s para que los deploys se reflejen sin reiniciar.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Debe quedar activo: Livewire/atributos leen doc-comments via reflection.
opcache.save_comments=1
