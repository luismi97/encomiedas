; Ajustes generales de PHP para el sistema de encomiendas.

; Espacio para generación de PDF (dompdf) y firma XAdES.
memory_limit=256M

; Certificados .p12 y adjuntos.
upload_max_filesize=20M
post_max_size=24M

; Firmar + transmitir a Hacienda puede tardar unos segundos.
max_execution_time=120

realpath_cache_size=4096K
realpath_cache_ttl=600

expose_php=Off
